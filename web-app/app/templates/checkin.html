{% extends "base.html" %}

{% block title %}Check In | Smart Internet Cafe{% endblock %}

{% block content %}
<section class="hero-panel compact-panel">
  <div class="hero-copy">
    <p class="eyebrow">Arrival Check-In</p>
    <h1>Match the arriving guest to a pending reservation.</h1>
  </div>

  <form id="checkin-form" class="form-card">
    <div class="form-heading">
      <span class="status-dot"></span>
      <strong>Guest lookup</strong>
    </div>
    <label>
      Name
      <input name="name" autocomplete="name" placeholder="Enter reservation name" required>
    </label>
    <button type="submit">Confirm check-in</button>
    <p id="checkin-result" class="result" role="status"></p>
  </form>
</section>
{% endblock %}
