{% extends "base.html" %}

{% block title %}Reservation | Smart Internet Cafe{% endblock %}

{% block content %}
<section class="hero-panel">
  <div class="hero-copy">
    <p class="eyebrow">Online Reservation</p>
    <h1>Reserve a gaming seat before you arrive.</h1>
  </div>

  <form id="reservation-form" class="form-card">
    <div class="form-heading">
      <span class="status-dot"></span>
      <strong>New booking</strong>
    </div>
    <label>
      Name
      <input name="name" autocomplete="name" placeholder="Enter your name" required>
    </label>
    <label>
      Phone
      <input name="phone" autocomplete="tel" placeholder="Optional">
    </label>
    <button type="submit">Create reservation</button>
    <p id="reservation-result" class="result" role="status"></p>
  </form>
</section>
{% endblock %}
