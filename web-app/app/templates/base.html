<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Smart Internet Cafe{% endblock %}</title>
    {% block extra_head %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}?v=seat-state-4">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/">
          <span class="brand-mark">S</span>
          <span>
            <strong>Smart Internet Cafe</strong>
          </span>
        </a>
        <nav class="nav" aria-label="Main navigation">
          {% if role == "user" %}
          <a href="/reservation">Reservation</a>
          <a href="/checkin">Check In</a>
          <a href="/logout">Logout</a>
          {% elif role == "admin" %}
          <a href="/admin">Admin</a>
          <a href="/logout">Logout</a>
          {% else %}
          <a href="/login">Login</a>
          {% endif %}
        </nav>
      </header>
      {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', path='/app.js') }}?v=seat-state-4"></script>
  </body>
</html>
